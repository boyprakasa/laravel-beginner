site_name: Laravel untuk Pemula
site_description: Panduan instalasi Laravel, Herd, dan Artisan dari nol untuk pemula
# site_url: https://NAMAUSER.github.io/NAMAREPO/
# repo_url: https://github.com/NAMAUSER/NAMAREPO

theme:
  name: material
  language: id
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest

nav:
  - Beranda: index.md
  - Instalasi:
      - Windows: windows.md
      - macOS: macos.md
      - Linux: linux.md
  - Dasar-dasar:
      - File .env: env.md
      - Composer: composer.md
      - npm dan npx: npm.md
  - Komponen Blade:
      - Navigasi Menu: komponen-navigasi.md
  - Aplikasi Uji Coba:
      - CRUD Data Buku: aplikasi-ujicoba-crud.md
      - CRUD dengan Relasi: crud-relasi.md
      - CRUD dengan Relasi Many-to-Many: crud-many-to-many.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
